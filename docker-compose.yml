# Kudos Board — run everything locally:  docker compose up --build
# Then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kudos
      POSTGRES_PASSWORD: kudos
      POSTGRES_DB: kudos
    volumes:
      - ./api/db:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kudos -d kudos"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://kudos:kudos@db:5432/kudos
      PORT: "3000"
      TEAM_TIME_ZONE: ${TEAM_TIME_ZONE:-UTC}   # the daily kudos allowance resets at midnight here
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
